<!DOCTYPE html>
<html lang="fr">
    <head>        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Too Good To Pay</title>
        <link rel="icon" type="image/x-icon" href="img/logo.png">

        <link rel="stylesheet" href="bootstrap-5.3.8/css/bootstrap.css">
        <link rel="stylesheet" href="form.css">
        
        <script src="fontawesome-7.3.1/js/all.js"></script>
        <script src="bootstrap-5.3.8/js/bootstrap.bundle.js"></script>
        <script src="form.js"></script>
    </head>
    <body class="">
        <div class="container-fluid">
            <div class="row justify-content-center my-3">
                <div class="col-11 col-lg-8 shadow bg-dark rounded-4 p-3">

                    <div class="row text-center text-light">
                        <h1>Too Good To Pay</h1>
                        <span>by Pedro & Polo</span>
                    </div>

                    <hr class="border-primary border-3 opacity-100 rounded-pill">

                    <div class="row mb-3">
                        <div class="col">
                            <a class="btn btn-secondary" href="/toogoodtopay/auto">
                                Recherche automatique
                            </a>
                        </div>
                    </div>

                    <div class="row">
                        <form>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="nom" placeholder="" required>
                                <label for="nom">Nom de l'établissement</label>
                            </div>

                            <div class="form-floating mb-3">
                                <select class="form-select" name="logo" id="floatingSelect">
                                    <option value="custom">Custom</option>
                                </select>
                                <label for="floatingSelect">Logo de l'établissement</label>
                            </div>

                            <div class="mb-3">
                                <input class="form-control" type="file" accept="image/*" id="custom" required>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="adresse" placeholder="" required>
                                <label for="adresse">Adresse de l'établissement</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="type" placeholder="" required>
                                <label for="floatingInput">Type de panier</label>
                            </div>

                            <div class="row justify-content-center mb-3 bg-light rounded mx-0 p-2">
                                <div class="row text-center">
                                    <span class="">Nombre de paniers</span>
                                </div>

                                <hr class="m-2">

                                <div class="row justify-content-around">
                                    <div class="col-2">
                                        <input type="radio" class="btn-check" name="nb" id="one" value="1" autocomplete="off" checked>
                                        <label class="btn btn-outline-primary" for="one">1</label>
                                    </div>
                                    <div class="col-2">
                                        <input type="radio" class="btn-check" name="nb" id="two" value="2" autocomplete="off">
                                        <label class="btn btn-outline-primary" for="two">2</label>
                                    </div>
                                    <div class="col-2">
                                        <input type="radio" class="btn-check" name="nb" id="three" value="3" autocomplete="off">
                                        <label class="btn btn-outline-primary" for="three">3</label>
                                    </div>
                                    <div class="col-2">
                                        <input type="radio" class="btn-check" name="nb" id="four" value="4" autocomplete="off">
                                        <label class="btn btn-outline-primary" for="four">4</label>
                                    </div>
                                    <div class="col-2">
                                        <input type="radio" class="btn-check" name="nb" id="five" value="5" autocomplete="off">
                                        <label class="btn btn-outline-primary" for="five">5</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" step=0.01 class="form-control" name="prix" placeholder="" required>
                                <label for="floatingInput">Prix d'un seul panier</label>
                            </div>

                            <div class="row bg-light mb-3 justify-content-around rounded mx-0 text-center">
                                <div class="row p-1">
                                    <div class="col align-self-center border-end">
                                        <span>Instructions de collecte</span>
                                    </div>
                                    <div class="col align-self-center">
                                        <div class="row">
                                            <span class="text-end" id="tooltip" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Tooltip on top">
                                                <i class="fa-solid fa-circle-question"></i>
                                            </span>
                                        </div>
                                        <div class="row">
                                            <div class="col">                                                
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox" id="switchInstructions" switch>
                                                    <label class="form-check-label" for="switchInstructions">
                                                        Par défaut
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row p-0">
                                    <textarea class="form-control rounded-top-0" id="ing" name="ing" required></textarea>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="time" class="form-control" name="deb" placeholder="" required>
                                <label for="floatingInput">Début collecte</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="time" class="form-control" name="fin" placeholder="" required>
                                <label for="floatingInput">Fin collecte</label>
                            </div>

                            <div class="row px-5">
                                <button type="submit" class="btn btn-success mb-3">Confirmer avec confirmation</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </body>
</html>
